packages:
  - packages/*
  - apps/*
  - docs

# pnpm 12 refuses versions published less than a day ago by default. Exact pins
# already decide what we install, so the delay only blocks deliberate bumps.
minimumReleaseAge: 0

# e2e and @e2e-dev/web develop against each other; pnpm 12 would
# otherwise refuse to run recursive scripts across that cycle.
ignoreWorkspaceCycles: true

allowBuilds:
  esbuild: true
  # @swmansion/argent (the mobile engine's optional argent driver) brings these
  # in; the tool server it runs needs none of them built to drive a device.
  '@fails-components/webtransport-transport-http3-quiche': false
  electron: false
  node-pty: false
  tree-sitter: false
  tree-sitter-javascript: false
  tree-sitter-typescript: false
  '@scarf/scarf': false
  keytar: false
  puppeteer: false
  sharp: false

overrides:
  'fast-uri@>=3.0.0 <3.1.8': 3.1.8
  'js-yaml@<3.15.2': 3.15.2
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'nanoid@<3.3.18': 3.3.18
  'undici@>=7.0.0 <7.29.0': 7.29.0
