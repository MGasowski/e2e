name: website-e2e

# The migration safety net for website/ (apps/website-e2e): functional and
# visual suites for the e2e landing page and the docs. They test production
# by default, which a pull request here cannot change, so the workflow is not
# a required check. It runs when the suite itself changes, and on demand
# against any URLs; the visual job takes `update_snapshots` to write Linux
# baselines and upload them for review.
#
# tester.army is behind Vercel's firewall, which challenges a headless
# browser that loads many pages: set the E2E_BYPASS_HEADER secret
# ("Name: value") to a header a firewall rule lets through.
on:
  pull_request:
    paths:
      - 'apps/website-e2e/**'
      - '.github/workflows/website-e2e.yml'
  workflow_dispatch:
    inputs:
      landing_url:
        description: Landing page URL (default https://tester.army/e2e)
        required: false
      docs_url:
        description: Docs URL (default https://e2e.tester.army/docs)
        required: false
      update_snapshots:
        description: Write new and changed visual baselines and upload them
        type: boolean
        default: false

env:
  E2E_TELEMETRY_DISABLED: '1'
  E2E_LANDING_URL: ${{ inputs.landing_url }}
  E2E_DOCS_URL: ${{ inputs.docs_url }}
  E2E_BYPASS_HEADER: ${{ secrets.E2E_BYPASS_HEADER }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  functional:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm --filter @e2e-dev/web exec playwright-core install chromium --with-deps
      - name: Build
        run: pnpm --filter e2e --filter @e2e-dev/web run build
      - name: Run test
        run: pnpm --filter @e2e-dev/website-e2e run test
      - name: Upload report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-e2e-functional
          path: |
            apps/website-e2e/.e2e/report.json
            apps/website-e2e/.e2e/results
          if-no-files-found: warn
          retention-days: 7

  # In Playwright's image, the one scripts/visual.mjs uses off Linux, so a
  # baseline written on a laptop matches CI's fonts and rendering exactly.
  # Keep the tag in step with playwright-core in packages/web/package.json.
  visual:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @e2e-dev/website-e2e...
      - name: Build
        run: pnpm --filter e2e --filter @e2e-dev/web run build
      - name: Run visual test
        run: pnpm --filter @e2e-dev/website-e2e run test:visual ${{ inputs.update_snapshots && '--update-snapshots' || '' }}
      - name: Upload report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-e2e-visual
          path: |
            apps/website-e2e/.e2e/report.json
            apps/website-e2e/.e2e/results
          if-no-files-found: warn
          retention-days: 7
      # Review the images, then copy them into apps/website-e2e/tests and commit.
      - name: Upload baselines
        if: ${{ !cancelled() && inputs.update_snapshots }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-e2e-baselines
          path: apps/website-e2e/tests/**/*-snapshots/*-linux.png
          retention-days: 7
