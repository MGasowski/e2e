name: website-e2e

# Functional and visual suites for website/ (apps/website-e2e): the e2e
# landing page and the docs, at desktop and phone sizes. Each job builds the
# site from this checkout and tests it on 127.0.0.1:3000, so a pull request
# that changes website/, a docs page, or the suite is tested as it stands.
# Run it on demand against any URLs instead (production, a preview); the
# visual job takes `update_snapshots` to write Linux baselines and upload
# them for review.
#
# tester.army is behind Vercel's firewall, which challenges a headless
# browser that loads many pages: for runs against it, set the
# E2E_BYPASS_HEADER secret ("Name: value") to a header a firewall rule lets through.
on:
  pull_request:
    paths:
      - 'apps/website-e2e/**'
      - 'website/**'
      - 'docs/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/website-e2e.yml'
  workflow_dispatch:
    inputs:
      landing_url:
        description: Landing page URL (default this checkout's website/ build)
        required: false
      docs_url:
        description: Docs URL (default this checkout's website/ build)
        required: false
      update_snapshots:
        description: Write new and changed visual baselines and upload them
        type: boolean
        default: false

env:
  E2E_TELEMETRY_DISABLED: '1'
  E2E_LANDING_URL: ${{ inputs.landing_url || 'http://127.0.0.1:3000/e2e' }}
  E2E_DOCS_URL: ${{ inputs.docs_url || 'http://127.0.0.1:3000/docs' }}
  # Absolute URLs in the site's metadata point back at the local server.
  SITE_URL: http://127.0.0.1:3000
  NEXT_TELEMETRY_DISABLED: '1'

  E2E_BYPASS_HEADER: ${{ secrets.E2E_BYPASS_HEADER }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  functional:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm --filter @e2e-dev/web exec playwright-core install chromium --with-deps
      - name: Build
        run: pnpm --filter e2e --filter @e2e-dev/web run build
      - name: Build and start website
        run: |
          pnpm --filter @e2e-dev/website run build
          (pnpm --filter @e2e-dev/website exec next start --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/website.log" 2>&1 &)
          for i in $(seq 1 60); do node -e "fetch('http://127.0.0.1:3000/docs').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))" && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/website.log"; exit 1
      - name: Run test
        run: pnpm --filter @e2e-dev/website-e2e run test
      - name: Upload report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-e2e-functional
          path: |
            apps/website-e2e/.e2e/report.json
            apps/website-e2e/.e2e/results
          if-no-files-found: warn
          retention-days: 7

  # In Playwright's image, the one scripts/visual.mjs uses off Linux, so a
  # baseline written on a laptop matches CI's fonts and rendering exactly.
  # Keep the tag in step with playwright-core in packages/web/package.json.
  visual:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @e2e-dev/website-e2e... --filter @e2e-dev/website
      - name: Build
        run: pnpm --filter e2e --filter @e2e-dev/web run build
      - name: Build and start website
        run: |
          pnpm --filter @e2e-dev/website run build
          (pnpm --filter @e2e-dev/website exec next start --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/website.log" 2>&1 &)
          for i in $(seq 1 60); do node -e "fetch('http://127.0.0.1:3000/docs').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))" && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/website.log"; exit 1
      - name: Run visual test
        run: pnpm --filter @e2e-dev/website-e2e run test:visual ${{ inputs.update_snapshots && '--update-snapshots' || '' }}
      - name: Upload report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-e2e-visual
          path: |
            apps/website-e2e/.e2e/report.json
            apps/website-e2e/.e2e/results
          if-no-files-found: warn
          retention-days: 7
      # Review the images, then copy them into apps/website-e2e/tests and commit.
      - name: Upload baselines
        if: ${{ !cancelled() && inputs.update_snapshots }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-e2e-baselines
          path: apps/website-e2e/tests/**/*-snapshots/*-linux.png
          retention-days: 7
